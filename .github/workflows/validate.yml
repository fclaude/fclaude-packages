name: Validate packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: Apple Silicon
          - os: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out packages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ae72030040bc05e2d65c41c577092cb98bc0a27e
        with:
          stable: true
      - name: Register this exact checkout as a tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/fclaude"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/fclaude/homebrew-fclaude-packages"
      - name: Show platform
        run: |
          uname -m
          sw_vers
          brew --version
      - name: Trust only the four packages under test
        run: |
          brew trust --formula fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
          brew trust --cask fclaude/fclaude-packages/sqlite-explorer
      - name: Check formula and cask style
        run: brew style fclaude/fclaude-packages
      - name: Audit package definitions
        run: |
          brew audit --strict --formula fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
          brew audit --cask --online fclaude/fclaude-packages/sqlite-explorer
      - name: Install and test released binaries
        run: |
          test -z "$(brew deps --include-build fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot)"
          brew install fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
          for command in brote brote-lsp coigue hoot; do
            lipo "$(command -v "$command")" -verify_arch "$(uname -m)"
          done
          brew test fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
          brew linkage --test fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
      - name: Exercise terminal applications
        run: /usr/bin/python3 "$(brew --repository fclaude/fclaude-packages)/scripts/pty-smoke.py"
      - name: Install and verify SQLite Explorer
        run: |
          brew install --cask fclaude/fclaude-packages/sqlite-explorer
          app=/Applications/sqlite-explorer.app
          test -x "$app/Contents/MacOS/sqlite-explorer"
          test -f "$app/Contents/Resources/LICENSE"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = cl.recoded.sqlite-explorer
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 12.0
          lipo "$app/Contents/MacOS/sqlite-explorer" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
      - name: Check uninstall
        run: |
          brew uninstall --cask fclaude/fclaude-packages/sqlite-explorer
          test ! -e /Applications/sqlite-explorer.app
          brew uninstall fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
