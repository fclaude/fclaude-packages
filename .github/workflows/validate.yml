name: Validate packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: Apple Silicon
          - os: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out packages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ae72030040bc05e2d65c41c577092cb98bc0a27e
        with:
          stable: true
      - name: Register this exact checkout as a tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/fclaude"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/fclaude/homebrew-fclaude-packages"
      - name: Show platform
        run: |
          uname -m
          sw_vers
          brew --version
      - name: Trust only the five packages under test
        run: |
          brew trust --formula fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
          brew trust --cask fclaude/fclaude-packages/sqlite-explorer fclaude/fclaude-packages/nodwyn
      - name: Check formula and cask style
        # shfmt has no Intel macOS bottle; lint shared files once on Apple Silicon.
        if: matrix.arch == 'Apple Silicon'
        run: brew style Formula Casks .github/workflows/validate.yml scripts/test-linux.sh
      - name: Audit package definitions
        run: |
          brew audit --strict --formula fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
          brew audit --cask --online fclaude/fclaude-packages/sqlite-explorer fclaude/fclaude-packages/nodwyn
      - name: Install and test released binaries
        run: |
          test -z "$(brew deps --include-build fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot)"
          brew install fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
          for command in brote brote-lsp coigue hoot; do
            lipo "$(command -v "$command")" -verify_arch "$(uname -m)"
          done
          brew test fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
          brew linkage --test fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot
      - name: Exercise terminal applications
        run: /usr/bin/python3 "$(brew --repository fclaude/fclaude-packages)/scripts/pty-smoke.py"
      - name: Install and verify SQLite Explorer
        run: |
          brew install --cask fclaude/fclaude-packages/sqlite-explorer
          app=/Applications/sqlite-explorer.app
          test -x "$app/Contents/MacOS/sqlite-explorer"
          test -f "$app/Contents/Resources/LICENSE"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = cl.recoded.sqlite-explorer
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 12.0
          lipo "$app/Contents/MacOS/sqlite-explorer" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
      - name: Install and verify Nodwyn
        run: |
          brew install --cask fclaude/fclaude-packages/nodwyn
          app=/Applications/Nodwyn.app
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.nodwyn.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.1.4
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = Nodwyn
          test -s "$app/Contents/Resources/Nodwyn.icns"
          lipo "$app/Contents/MacOS/nodwyn" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
          for arch in amd64 arm64; do
            test "$(head -c 4 "$app/Contents/MacOS/nodwyn-egress-linux-$arch" | od -An -tx1 | tr -d ' ')" = 7f454c46
          done
          # The command on PATH runs the app's own executable, and it is the
          # webview build: only that one holds the desktop bridge's script.
          test "$(nodwyn version)" = 'nodwyn 1286c6ad19c414b1b38314a35b56fa725e93cc5e'
          strings "$app/Contents/MacOS/nodwyn" | grep -q main.desktopScript
      - name: Check uninstall
        run: |
          brew uninstall --cask fclaude/fclaude-packages/sqlite-explorer
          test ! -e /Applications/sqlite-explorer.app
          brew uninstall --cask fclaude/fclaude-packages/nodwyn
          test ! -e /Applications/Nodwyn.app
          test ! -e "$(brew --prefix)/bin/nodwyn"
          brew uninstall fclaude/fclaude-packages/brote fclaude/fclaude-packages/coigue fclaude/fclaude-packages/hoot

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out packages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check packaging integrity guards
        run: python3 scripts/test-packaging.py
      - name: Verify upstream assets and build release packages
        run: python3 scripts/build-linux.py --arch "$PACKAGE_ARCH"
      - name: Test Ubuntu 24.04 install, behavior, and uninstall
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/dist/linux/$PACKAGE_ARCH:/packages:ro" \
            ubuntu:24.04 bash /workspace/scripts/test-linux.sh deb "$PACKAGE_ARCH"
      - name: Test Fedora 44 install, behavior, and uninstall
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/dist/linux/$PACKAGE_ARCH:/packages:ro" \
            fedora:44 bash /workspace/scripts/test-linux.sh rpm "$PACKAGE_ARCH"
      - name: Upload verified downloadable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified Linux packages
    needs: [macos, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the native-tested packages from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: linux-*
          path: release-artifacts
      - name: Publish a new versioned package set from verified bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-linux.py
